version: '3.8'

services:
  cabe-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cabe_flask_app
    restart: unless-stopped
    ports:
      - "8100:80"  # Format: "HOST_PORT:CONTAINER_PORT" (Akses via http://localhost:8100)
    volumes:
      # Persistent storage untuk file upload
      - ./static/uploads:/app/static/uploads
      # Opsional: mount folder model jika ingin update model tanpa rebuild container
      - ./model:/app/model
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
